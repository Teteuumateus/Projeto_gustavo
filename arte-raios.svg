<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1560" width="1200" height="1560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="1560" fill="#0a1628"/>
  <rect x="24" y="24" width="1152" height="1512" rx="24" fill="none" stroke="#1f3a5f" stroke-width="2"/>

  <!-- Título -->
  <text x="600" y="110" text-anchor="middle" fill="#e6eef9" font-size="54" font-weight="800">Raio de Entrega · Barueri/SP</text>
  <text x="600" y="156" text-anchor="middle" fill="#8da4c4" font-size="26">Rua Serra da Cantareira, 237 — ponto de referência</text>

  <!-- Círculos (do maior para o menor) -->
  <g transform="translate(600 700)">
    <circle r="500" fill="#dc2626" fill-opacity=".10" stroke="#dc2626" stroke-width="5"/>
    <circle r="400" fill="#3b82f6" fill-opacity=".12" stroke="#3b82f6" stroke-width="5"/>
    <circle r="300" fill="#22c55e" fill-opacity=".14" stroke="#22c55e" stroke-width="5"/>
    <circle r="200" fill="#f59e0b" fill-opacity=".16" stroke="#f59e0b" stroke-width="5"/>
    <circle r="100" fill="#ef4444" fill-opacity=".20" stroke="#ef4444" stroke-width="5"/>

    <!-- Rótulos de km -->
    <g font-size="26" font-weight="700" text-anchor="middle" fill="#fff">
      <text y="-106">1 km</text><text y="-206">2 km</text><text y="-306">3 km</text>
      <text y="-406">4 km</text><text y="-506">5 km</text>
    </g>

    <!-- Estrela central -->
    <circle r="30" fill="#3b82f6" stroke="#fff" stroke-width="5"/>
    <text y="12" text-anchor="middle" fill="#fff" font-size="34">★</text>
  </g>

  <!-- Faixas, bairros e valor do motoboy -->
  <g font-size="24">
    <g transform="translate(60 1260)">
      <rect width="210" height="230" rx="16" fill="#12263f" stroke="#ef4444" stroke-width="3"/>
      <text x="105" y="44" text-anchor="middle" fill="#ef4444" font-weight="800" font-size="26">Até 1 km</text>
      <text x="105" y="100" text-anchor="middle" fill="#e6eef9" font-weight="800" font-size="30">R$ 4,99</text>
      <text x="105" y="132" text-anchor="middle" fill="#8da4c4" font-size="20">10 min</text>
      <text x="105" y="172" text-anchor="middle" fill="#e6eef9" font-size="19">Centro</text>
      <text x="105" y="198" text-anchor="middle" fill="#e6eef9" font-size="19">Aldeia de Barueri</text>
    </g>
    <g transform="translate(282 1260)">
      <rect width="210" height="230" rx="16" fill="#12263f" stroke="#f59e0b" stroke-width="3"/>
      <text x="105" y="44" text-anchor="middle" fill="#f59e0b" font-weight="800" font-size="26">1 a 2 km</text>
      <text x="105" y="100" text-anchor="middle" fill="#e6eef9" font-weight="800" font-size="30">R$ 5,99</text>
      <text x="105" y="132" text-anchor="middle" fill="#8da4c4" font-size="20">10 min</text>
      <text x="105" y="172" text-anchor="middle" fill="#e6eef9" font-size="19">Jardim Belval</text>
      <text x="105" y="198" text-anchor="middle" fill="#e6eef9" font-size="19">Alphaville · Pindorama</text>
    </g>
    <g transform="translate(504 1260)">
      <rect width="210" height="230" rx="16" fill="#12263f" stroke="#22c55e" stroke-width="3"/>
      <text x="105" y="44" text-anchor="middle" fill="#22c55e" font-weight="800" font-size="26">2 a 3 km</text>
      <text x="105" y="100" text-anchor="middle" fill="#e6eef9" font-weight="800" font-size="30">R$ 6,99</text>
      <text x="105" y="132" text-anchor="middle" fill="#8da4c4" font-size="20">10 min</text>
      <text x="105" y="172" text-anchor="middle" fill="#e6eef9" font-size="19">Jardim dos Altos</text>
      <text x="105" y="198" text-anchor="middle" fill="#e6eef9" font-size="19">Alphaville Ind. · Mutinga</text>
    </g>
    <g transform="translate(726 1260)">
      <rect width="210" height="230" rx="16" fill="#12263f" stroke="#3b82f6" stroke-width="3"/>
      <text x="105" y="44" text-anchor="middle" fill="#3b82f6" font-weight="800" font-size="26">3 a 4 km</text>
      <text x="105" y="100" text-anchor="middle" fill="#e6eef9" font-weight="800" font-size="30">R$ 8,99–9,99</text>
      <text x="105" y="132" text-anchor="middle" fill="#8da4c4" font-size="20">10 min</text>
      <text x="105" y="172" text-anchor="middle" fill="#e6eef9" font-size="19">Pirapora do Bom Jesus</text>
      <text x="105" y="198" text-anchor="middle" fill="#e6eef9" font-size="19">Santana de Parnaíba</text>
    </g>
    <g transform="translate(948 1260)">
      <rect width="192" height="230" rx="16" fill="#12263f" stroke="#dc2626" stroke-width="3"/>
      <text x="96" y="44" text-anchor="middle" fill="#dc2626" font-weight="800" font-size="26">4 a 5 km</text>
      <text x="96" y="100" text-anchor="middle" fill="#e6eef9" font-weight="800" font-size="30">R$ 11,99</text>
      <text x="96" y="132" text-anchor="middle" fill="#8da4c4" font-size="20">10 min</text>
      <text x="96" y="172" text-anchor="middle" fill="#e6eef9" font-size="19">Regiões afastadas</text>
      <text x="96" y="198" text-anchor="middle" fill="#e6eef9" font-size="19">e municípios vizinhos</text>
    </g>
  </g>

  <text x="600" y="1520" text-anchor="middle" fill="#8da4c4" font-size="20">Acima de 5 km: fora da área de cobertura · Valores pagos ao motoboy</text>
</svg>
