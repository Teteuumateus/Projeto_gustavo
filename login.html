<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar – RAIO DELIVERY</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <span class="brand-icon" aria-hidden="true">◎</span>
    <h1>RAIO DELIVERY</h1>
    <p class="login-sub">Calculadora de frete · acesse para continuar</p>

    <form id="loginForm" autocomplete="off">
      <label for="user">Usuário</label>
      <input id="user" type="text" required autofocus>

      <label for="pass">Senha</label>
      <input id="pass" type="password" required>

      <div id="loginError" class="message error" hidden role="alert">Usuário ou senha incorretos.</div>
      <button type="submit" class="btn primary">Entrar</button>
    </form>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
